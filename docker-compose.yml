services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: always
    environment:
      # Main application URLs - configure these in Portainer environment variables
      MAIN_URL: "${POSTIZ_MAIN_URL}"
      FRONTEND_URL: "${POSTIZ_FRONTEND_URL}"
      NEXT_PUBLIC_BACKEND_URL: "${POSTIZ_BACKEND_URL}"
      JWT_SECRET: "${POSTIZ_JWT_SECRET}"
 
      # Database configuration - AWS PostgreSQL
      DATABASE_URL: "${POSTIZ_DATABASE_URL}"
      REDIS_URL: "${POSTIZ_REDIS_URL:-redis://postiz-redis:6379}"
      BACKEND_INTERNAL_URL: "${POSTIZ_BACKEND_INTERNAL_URL:-http://localhost:3000}"
      IS_GENERAL: "${POSTIZ_IS_GENERAL:-true}"
      DISABLE_REGISTRATION: "${POSTIZ_DISABLE_REGISTRATION:-false}"
      
      # Storage configuration
      STORAGE_PROVIDER: "${POSTIZ_STORAGE_PROVIDER:-local}"
      UPLOAD_DIRECTORY: "${POSTIZ_UPLOAD_DIRECTORY:-/uploads}"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "${POSTIZ_NEXT_PUBLIC_UPLOAD_DIRECTORY:-/uploads}"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "${POSTIZ_PORT:-5000}:5000"
    networks:
      - postiz-network
    depends_on:
      postiz-redis:
        condition: service_healthy
 
  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network
 
 
volumes:
  postiz-redis-data:
    external: false
 
  postiz-config:
    external: false
 
  postiz-uploads:
    external: false
 
networks:
  postiz-network:
    external: false